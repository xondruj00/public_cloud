<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">

<html>
<head>
  <title> ITU ajax </title>
  <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-2" />
  <style type="text/css">
  div, input { margin: 10px; }
  </style>
</head>
<body>

<div id="chatArea" style="height: 300px; border: solid #aaa 1px; overflow:auto;"></div> 

<form onsubmit="return uploadData()">
  <input type="text" id="newMessageString">
  <input type="submit" value="send">
</form>

<div id="status" style="border: solid #aaa 1px; ">&nbsp;</div> 


<script type="text/javascript">

/***
  * XMLHttpRequest object constructor (for compatibility with various browsers)
  */
function createXmlHttpRequestObject() 
{
    var request;
  
    try
    {
        request = new XMLHttpRequest(); // should work on all browsers except IE6 or older
    } 
    catch (e) 
    { 
        try 
        {
            request = new ActiveXObject("Microsoft.XMLHttp"); // browser is IE6 or older
        }
        catch (e) 
        {
            // ignore error
        }
    }
  
    if (!request) 
    {
        alert("Error creating the XMLHttpRequest object.");
    } 
    else 
    {
        return request;
    }
}

function uploadData()
{
    document.getElementById("status").innerHTML = "uploadData()";

    try 
    {
        var request = createXmlHttpRequestObject(); // stores XMLHttpRequestObject
        //// put your code here
        var input = document.getElementById("newMessageString");
        if (input.value == "") return false;

        request.open("POST", SERVER_URL, true);
        request.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
        request.onreadystatechange = function()
        {
            if ((request.readyState == 4) && (request.status == 200))
            {
                downloadData(); // show own message immediately
            }
        }
        request.send("user=" + encodeURIComponent(LOGIN) + "&data=" + encodeURIComponent(input.value));
        input.value = "";
    }
    catch (e) 
    {
        alert(e.toString());
    }

    return false; // to avoid default form submit behavior 
}

function downloadData() 
{
    var request = createXmlHttpRequestObject();
    request.open("GET", SERVER_URL, true);
    request.onreadystatechange = function()
    {
        if ((request.readyState == 4) && (request.status == 200))
        {
            var messages = JSON.parse(request.responseText);
            var chatArea = document.getElementById("chatArea");
            var newIds = [];
            //// put your code here
            for (var i in messages)
            {
                var msg = messages[i];
                if (msg.id <= lastId) continue; 

                var div = document.createElement("div");
                div.textContent = "[" + msg.dts + "] " + msg.login + ": " + msg.cnt;
                chatArea.appendChild(div);

                lastId = msg.id;
                newIds.push(msg.id);
            }

            if (newIds.length > 0)
            {
                document.getElementById("status").innerHTML = "new messages: " + newIds.join(", ");
                chatArea.scrollTop = chatArea.scrollHeight;
            }
        }
    }
    request.send(null);
}
//// put your code here
var SERVER_URL = "http://butcluster.ddns.net/api.php";
var LOGIN = "xondruj00"; 
var lastId = 0;

downloadData();
setInterval(downloadData, 3000);

</script>
</body>
</html>
